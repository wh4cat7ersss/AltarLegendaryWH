help:
  lines:
    - "&8&m--------------------------------------------------"
    - "&6&l[AltarLegendary] &8— &eAltar Management Guide"
    - "&e1. &fGet altar block: &6/al altar give <player>"
    - "&e2. &fCreate altar at feet: &6/al altar create"
    - "&e3. &fSet result item (in main hand): &6/al altar set item <ID>"
    - "&e4. &fAdd recipe ingredient (in main hand): &6/al altar set recipe <ID>"
    - "&e5. &fAdd player head to recipe: &6/al altar set recipe <ID> head <amount> [player]"
    - "&e6. &fSet max uses: &6/al altar set use <ID> <amount|inf>"
    - "&e7. &fSet cooldown: &6/al altar set cooldown <ID> <seconds>"
    - ""
    - "&6&lRemoving Recipe & Items:"
    - "&f/al altar remove recipe <ID> <position> &8— &7remove specific ingredient"
    - "&f/al altar remove item <ID> &8— &7remove result and clear all ingredients"
    - ""
    - "&6&lManagement & Templates:"
    - "&f/al altar delete <ID|all> &8— &7delete an altar or all altars"
    - "&f/al altar teleport <ID> &8— &7teleport to an altar"
    - "&f/al altar teleporthere <ID> &8— &7move an altar to your position"
    - "&f/al altar save <ID> <name> &8— &7save altar as template in data/"
    - "&f/al altar load <name> &8— &7create altar from saved template"
    - "&f/al altar set scale <title|recipe|item> <ID|all|def> <value>"
    - "&f/al altar restart &8— &7recreate entities for all altars"
    - "&f/al altar reload &8— &7reload altars.yml and language"
    - "&8&m--------------------------------------------------"
