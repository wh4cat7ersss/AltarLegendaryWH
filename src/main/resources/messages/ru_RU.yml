help:
  lines:
    - "&8&m--------------------------------------------------"
    - "&6&l[AltarLegendary] &8— &eСправка по управлению алтарями"
    - "&e1. &fПолучить предмет алтаря: &6/al altar give <игрок>"
    - "&e2. &fСоздать алтарь на своей позиции: &6/al altar create"
    - "&e3. &fУстановить результат крафта (держите в руке): &6/al altar set item <ID>"
    - "&e4. &fДобавить ингредиент в рецепт (держите в руке): &6/al altar set recipe <ID>"
    - "&e5. &fРецепт с головой игрока: &6/al altar set recipe <ID> head <кол-во> [ник]"
    - "&e6. &fКоличество использований: &6/al altar set use <ID> <число|inf>"
    - "&e7. &fВремя перезарядки: &6/al altar set cooldown <ID> <секунды>"
    - ""
    - "&6&lУдаление рецепта и предметов:"
    - "&f/al altar remove recipe <ID> <номер> &8— &7удалить конкретный ингредиент"
    - "&f/al altar remove item <ID> &8— &7удалить результат и очистить весь рецепт"
    - ""
    - "&6&lУправление и шаблоны:"
    - "&f/al altar delete <ID|all> &8— &7удалить алтарь или все алтари"
    - "&f/al altar teleport <ID> &8— &7телепортироваться к алтарю"
    - "&f/al altar teleporthere <ID> &8— &7переместить алтарь к себе"
    - "&f/al altar save <ID> <название> &8— &7сохранить шаблон в data/"
    - "&f/al altar load <название> &8— &7создать алтарь из шаблона"
    - "&f/al altar set scale <title|recipe|item> <ID|all|def> <значение>"
    - "&f/al altar restart &8— &7пересоздать сущности всех алтарей"
    - "&f/al altar reload &8— &7перезагрузить altars.yml и язык"
    - "&8&m--------------------------------------------------"
