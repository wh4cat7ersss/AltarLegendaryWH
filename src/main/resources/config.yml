lang: en_US  # en_US for English, ru_RU для русского языка

limits:
  enabled: false
  # for the "on" type — true, for the "off" type — false
  # для выключения пишите - true, для выключения - false

  max-y-height: 200.0
  # A setting that specifies the altitude above which legendary weapons will not function (designed for high-altitude FFA spawn points).
  # Настройка которая указывает начиная какой высоты не будут работать легендарные оружия (сделано для спавнов которые находятся высоко для ффа)

  max-legendary-weapons: 4
  # the maximum number of weapons a player can carry in their inventory
  # максимум оружий которые игрок может носить в инвентаре

  max-copper-armor: 2
  # maximum wearable copper armor
  # максимум ношения медной брони

  # Next comes the configuration of the legendary weapons themselves; to configure the items or the copper armor, go to `items.yml`.
  # дальше идет настройка самих легендарных оружий, чтобы настроить предметы или медную броню то заходите в items.yml
